<!DOCTYPE html>
<html>
<head><title>CDN Test</title></head>
<body>
<h1>CDN Load Test</h1>
<div id="status">Loading...</div>
<div id="vue-test">{{ message }}</div>
<script>
var results = [];
function check(name, url) {
  var s = document.createElement('script');
  s.src = url;
  s.onload = function() { results.push(name + ': OK'); update(); };
  s.onerror = function() { results.push(name + ': FAIL'); update(); };
  document.head.appendChild(s);
}
function update() {
  document.getElementById('status').innerHTML = results.join('<br>');
  if (typeof Vue !== 'undefined') {
    Vue.createApp({ data() { return { message: 'Vue works!' } } }).mount('#vue-test');
  }
}
check('Vue 3.5.13 (cdnjs)', 'https://cdnjs.cloudflare.com/ajax/libs/vue/3.5.13/vue.global.prod.min.js');
check('ECharts 5.5.1 (jsdelivr)', 'https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js');
check('ElementPlus 2.14.0 (cdnjs)', 'https://cdnjs.cloudflare.com/ajax/libs/element-plus/2.14.0/index.full.min.js');
setTimeout(function() {
  if (results.length < 3) {
    results.push('Timeout - some scripts did not load');
    update();
  }
}, 10000);
</script>
</body>
</html>
